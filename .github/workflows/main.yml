name: Order Service CI

on:
  push:
    branches:
      - main

jobs:
  code_quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Gradle quality checks
        run: |
          chmod +x ./gradlew
          ./gradlew check -x test

  unit_test:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: order_service
          POSTGRES_USER: order_service
          POSTGRES_PASSWORD: order_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U order_service -d order_service"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/order_service
      SPRING_DATASOURCE_USERNAME: order_service
      SPRING_DATASOURCE_PASSWORD: order_service
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew test

  build:
    name: Build and package
    runs-on: ubuntu-latest
    needs:
      - code_quality
      - unit_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: order-service-artifact
          path: build/libs/*.jar
          retention-days: 7
